<style>
  :root{
    --bg:#100A1E;
    --surface:#1B1230;
    --surface-2:#241A3D;
    --border:#352A54;
    --text:#EDEBF5;
    --muted:#A79ECC;
    --primary:#A855F7;
    --primary-ink:#1A0F2E;
    --ring:rgba(168,85,247,0.45);
    --radius:14px;
    --sidebar-w:264px;
  }
  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{
    margin:0; color:var(--text);
    font-family:'Inter',system-ui,sans-serif; font-size:14px;
    -webkit-font-smoothing:antialiased;
    background:
      radial-gradient(circle at 50% 20%, rgba(168,85,247,0.30), transparent 55%),
      radial-gradient(circle at 15% 80%, rgba(124,58,237,0.18), transparent 50%),
      radial-gradient(circle at 85% 70%, rgba(88,28,135,0.22), transparent 55%),
      var(--bg);
  }

  /* ---------- rising particle field ---------- */
  .bg-particles{
    position:fixed; inset:0; overflow:hidden; z-index:0; pointer-events:none;
  }
  .particle{
    position:absolute; bottom:-40px; border-radius:50%; background:#FFFFFF;
    opacity:0; box-shadow:0 0 12px 4px rgba(255,255,255,0.65);
    animation-name:rise; animation-timing-function:linear; animation-iteration-count:infinite;
  }
  @keyframes rise{
    0%{ transform:translateY(0) translateX(0); opacity:0; }
    8%{ opacity:.85; }
    85%{ opacity:.55; }
    100%{ transform:translateY(-110vh) translateX(var(--drift,20px)); opacity:0; }
  }
  @media (prefers-reduced-motion: reduce){ .particle{animation:none; display:none;} }
  .shell, .topbar, .scrim{ position:relative; z-index:1; }
  button{font-family:inherit; cursor:pointer;}
  a{color:inherit; text-decoration:none;}
  ::selection{background:var(--primary); color:var(--primary-ink);}
  a:focus-visible, button:focus-visible, input:focus-visible, textarea:focus-visible{
    outline:2px solid var(--primary); outline-offset:2px;
  }
  .icon{width:16px; height:16px; stroke:currentColor; fill:none; stroke-width:1.8; stroke-linecap:round; stroke-linejoin:round; display:block;}

  /* ---------- app shell ---------- */
  .shell{display:flex; height:100vh; overflow:hidden;}

  /* ---------- sidebar ---------- */
  .sidebar{
    width:var(--sidebar-w); flex-shrink:0; display:flex; flex-direction:column;
    border-right:1px solid var(--border); background:var(--surface);
    transition:margin-left .25s ease; padding-top:60px;
  }
  .sidebar.collapsed{margin-left:calc(-1 * var(--sidebar-w));}
  .sidebar-inner{display:flex; flex-direction:column; height:100%; padding:14px; gap:14px; min-height:0;}
  .new-chat{
    display:flex; align-items:center; gap:8px; justify-content:center;
    background:var(--primary); color:var(--primary-ink); border:none;
    border-radius:10px; padding:10px 14px; font-weight:600; font-size:13.5px;
  }
  .new-chat:hover{filter:brightness(1.08);}
  .search-box{
    display:flex; align-items:center; gap:8px; background:var(--bg);
    border:1px solid var(--border); border-radius:10px; padding:9px 11px;
  }
  .search-box input{
    background:transparent; border:none; color:var(--text); width:100%;
    font-size:13px;
  }
  .search-box input::placeholder{color:var(--muted);}
  .search-box .icon{color:var(--muted); flex-shrink:0;}

  .chat-groups{overflow-y:auto; flex:1; margin:0 -14px; padding:0 14px;}
  .group-label{
    font-family:'Fira Code',monospace; font-size:10.5px; letter-spacing:.08em;
    text-transform:uppercase; color:var(--muted); margin:16px 0 6px; padding:0 4px;
  }
  .group-label:first-child{margin-top:0;}
  .chat-item{
    display:flex; align-items:center; gap:9px; padding:8px 9px; border-radius:9px;
    color:#C9CCD0; font-size:13px;
  }
  .chat-item .icon{color:var(--muted); flex-shrink:0;}
  .chat-item span{white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  .chat-item:hover{background:var(--surface-2); color:var(--text);}
  .chat-item.active{background:var(--surface-2); color:var(--text); border:1px solid var(--border);}

  .sidebar-footer{
    display:flex; align-items:center; justify-content:space-between; gap:8px;
    border-top:1px solid var(--border); padding-top:12px;
  }
  .user-row{display:flex; align-items:center; gap:9px; min-width:0;}
  .avatar{
    width:28px; height:28px; border-radius:50%; flex-shrink:0;
    background:linear-gradient(135deg,#C084FC,#6D28D9);
  }
  .user-row .name{font-size:12.5px; font-weight:500; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
  .user-row .plan{font-size:11px; color:var(--muted);}
  .icon-btn{
    display:flex; align-items:center; justify-content:center; width:32px; height:32px;
    border-radius:8px; border:1px solid transparent; background:transparent; color:var(--muted);
    flex-shrink:0;
  }
  .icon-btn:hover{background:var(--surface-2); color:var(--text); border-color:var(--border);}

  /* ---------- header ---------- */
  .topbar{
    position:fixed; top:0; left:0; right:0; height:60px; z-index:10;
    display:flex; align-items:center; justify-content:space-between;
    padding:0 16px; pointer-events:none;
  }
  .topbar > *{pointer-events:auto;}
  .top-left{display:flex; align-items:center; gap:10px;}
  .wordmark{
    font-family:'Lora',serif; font-style:italic; font-weight:500; font-size:1.15rem;
    letter-spacing:.01em;
  }
  .top-right{display:flex; align-items:center; gap:6px;}
  .icon-btn.notif{position:relative;}
  .icon-btn.notif::after{
    content:""; position:absolute; top:6px; right:6px; width:6px; height:6px;
    border-radius:50%; background:var(--primary); border:1.5px solid var(--surface);
  }

  /* ---------- main ---------- */
  .main{flex:1; min-width:0; display:flex; flex-direction:column; overflow-y:auto;}
  .hero{
    flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center;
    padding:90px 20px 40px; text-align:center; position:relative;
  }
  .glow{
    position:absolute; top:38%; left:50%; width:560px; height:560px;
    transform:translate(-50%,-50%); border-radius:50%;
    background:radial-gradient(circle, rgba(168,85,247,0.28), transparent 70%);
    filter:blur(10px); animation:breathe 6s ease-in-out infinite; pointer-events:none;
  }
  @keyframes breathe{
    0%,100%{opacity:.7; transform:translate(-50%,-50%) scale(1);}
    50%{opacity:1; transform:translate(-50%,-50%) scale(1.08);}
  }
  @media (prefers-reduced-motion: reduce){ .glow{animation:none;} }

  .brand-mark{
    font-family:'Lora',serif; font-style:italic; font-size:2.1rem; margin:0 0 6px;
    position:relative;
  }
  .greeting{
    font-size:1.5rem; font-weight:500; margin:0 0 26px; position:relative;
    color:#F2F3F4;
  }

  .prompt-box{
    width:100%; max-width:640px; background:var(--surface); border:1px solid var(--border);
    border-radius:22px; padding:8px; box-shadow:0 20px 50px -20px rgba(0,0,0,0.6);
    position:relative; transition:border-color .2s ease;
  }
  .prompt-box:focus-within{border-color:rgba(232,163,61,0.55);}
  .prompt-box textarea{
    width:100%; background:transparent; border:none; color:var(--text); resize:none;
    font-family:inherit; font-size:14.5px; line-height:1.5; padding:10px 10px 4px;
    max-height:160px; min-height:24px;
  }
  .prompt-box textarea::placeholder{color:var(--muted);}
  .prompt-row{display:flex; align-items:center; justify-content:space-between; padding:2px 4px 2px 8px;}
  .add-btn{
    width:34px; height:34px; border-radius:50%; border:1px solid var(--border);
    background:var(--surface-2); color:var(--text); display:flex; align-items:center; justify-content:center;
  }
  .add-btn:hover{background:#242A31;}
  .send-btn{
    width:34px; height:34px; border-radius:50%; border:none; background:var(--primary);
    color:var(--primary-ink); display:flex; align-items:center; justify-content:center;
    opacity:.45; transition:opacity .15s ease;
  }
  .send-btn.active{opacity:1;}
  .send-btn:hover.active{filter:brightness(1.08);}

  .chips{display:flex; flex-wrap:wrap; gap:9px; justify-content:center; margin-top:22px; max-width:640px; position:relative;}
  .chip{
    display:flex; align-items:center; gap:7px; padding:8px 14px; border-radius:999px;
    border:1px solid var(--border); background:var(--surface); color:#C9CCD0; font-size:13px;
  }
  .chip .icon{color:var(--primary); width:15px; height:15px;}
  .chip:hover{background:var(--surface-2); color:var(--text); border-color:#33393F;}

  /* ---------- launcher row ---------- */
  .launcher{padding:36px 20px 8px; max-width:900px; margin:0 auto; width:100%;}
  .launcher-grid{
    display:grid; grid-template-columns:repeat(4,1fr); gap:16px 12px;
  }
  @media(min-width:560px){ .launcher-grid{grid-template-columns:repeat(8,1fr);} }
  .launch-tile{display:flex; flex-direction:column; align-items:center; gap:7px;}
  .launch-tile .tile-icon{
    width:44px; height:44px; border-radius:13px; background:var(--surface);
    border:1px solid var(--border); display:flex; align-items:center; justify-content:center;
    color:#C9CCD0;
  }
  .launch-tile:hover .tile-icon{background:var(--surface-2); color:var(--text); border-color:#33393F;}
  .launch-tile .tile-label{font-size:11px; color:var(--muted); text-align:center;}

  /* ---------- gallery ---------- */
  .gallery-section{max-width:1100px; margin:0 auto; width:100%; padding:44px 20px 60px;}
  .gallery-head{
    display:flex; align-items:baseline; justify-content:space-between; margin-bottom:16px;
  }
  .gallery-head h2{font-size:1.05rem; font-weight:600; margin:0;}
  .gallery-head .refresh{
    display:flex; align-items:center; gap:6px; font-size:12.5px; color:var(--muted);
    background:none; border:none;
  }
  .gallery-head .refresh:hover{color:var(--text);}
  .gallery-grid{
    display:grid; grid-template-columns:repeat(2,1fr); gap:14px;
  }
  @media(min-width:640px){ .gallery-grid{grid-template-columns:repeat(3,1fr);} }
  @media(min-width:900px){ .gallery-grid{grid-template-columns:repeat(4,1fr);} }
  .tile{
    border:1px solid var(--border); border-radius:16px; overflow:hidden; background:var(--surface);
  }
  .tile-thumb{
    aspect-ratio:1/1; position:relative; overflow:hidden;
  }
  .tile-thumb .badge{
    position:absolute; top:8px; left:8px; z-index:2; font-size:10.5px; padding:3px 8px;
    border-radius:6px; background:rgba(11,13,16,0.65); border:1px solid rgba(255,255,255,0.08);
    color:#E5E6E7; backdrop-filter:blur(3px);
  }
  .tile-thumb .overlay{
    position:absolute; inset:0; background:rgba(11,13,16,0.4); opacity:0; transition:opacity .2s ease;
    display:flex; align-items:center; justify-content:center; gap:8px;
  }
  .tile:hover .overlay{opacity:1;}
  .tile-thumb .overlay button{
    width:32px; height:32px; border-radius:50%; border:none; background:rgba(20,23,27,0.9);
    color:var(--text); display:flex; align-items:center; justify-content:center;
  }
  .tile-thumb .overlay button:hover{background:var(--primary); color:var(--primary-ink);}
  .tile-caption{padding:10px 12px 12px; font-size:12.5px; font-weight:500; color:#D6D8DA;
    display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden;}

  /* mobile: overlay sidebar as drawer */
  .scrim{
    position:fixed; inset:0; background:rgba(0,0,0,0.5); opacity:0; pointer-events:none;
    transition:opacity .2s ease; z-index:20;
  }
  .scrim.show{opacity:1; pointer-events:auto;}
  @media (max-width:860px){
    .sidebar{position:fixed; top:0; left:0; bottom:0; z-index:30; margin-left:calc(-1 * var(--sidebar-w));}
    .sidebar.open{margin-left:0;}
    .sidebar.collapsed{margin-left:calc(-1 * var(--sidebar-w));}
  }
</style>

<script>
  // ---- rising particle field ----
  (function(){
    const field = document.getElementById('bgParticles');
    const count = 26;
    for(let i = 0; i < count; i++){
      const p = document.createElement('div');
      p.className = 'particle';
      const size = 3 + Math.random() * 7;
      const left = Math.random() * 100;
      const duration = 14 + Math.random() * 16;
      const delay = -Math.random() * duration;
      const drift = (Math.random() * 80 - 40).toFixed(0) + 'px';
      p.style.width = size + 'px';
      p.style.height = size + 'px';
      p.style.left = left + '%';
      p.style.setProperty('--drift', drift);
      p.style.animationDuration = duration + 's';
      p.style.animationDelay = delay + 's';
      field.appendChild(p);
    }
  })();

  // ---- sidebar toggle (desktop collapse + mobile drawer) ----
  const sidebar = document.getElementById('sidebar');
  const scrim = document.getElementById('scrim');
  const toggleBtn = document.getElementById('sidebarToggle');
  function isMobile(){ return window.matchMedia('(max-width:860px)').matches; }
  toggleBtn.addEventListener('click', () => {
    if(isMobile()){
      sidebar.classList.toggle('open');
      scrim.classList.toggle('show');
    } else {
      sidebar.classList.toggle('collapsed');
    }
  });
  scrim.addEventListener('click', () => {
    sidebar.classList.remove('open');
    scrim.classList.remove('show');
  });

  // ---- prompt box: autosize + enable send on input ----
  const promptInput = document.getElementById('promptInput');
  const sendBtn = document.getElementById('sendBtn');
  const SEARCH_ENGINE_URL = 'https://duckduckgo.com/?q=';

  function runSearch(){
    const query = promptInput.value.trim();
    if(!query) return;
    window.open(SEARCH_ENGINE_URL + encodeURIComponent(query), '_blank', 'noopener');
    promptInput.value = '';
    promptInput.style.height = 'auto';
    sendBtn.classList.remove('active');
  }

  promptInput.addEventListener('input', () => {
    promptInput.style.height = 'auto';
    promptInput.style.height = Math.min(promptInput.scrollHeight, 160) + 'px';
    sendBtn.classList.toggle('active', promptInput.value.trim().length > 0);
  });
  promptInput.addEventListener('keydown', (e) => {
    if(e.key === 'Enter' && !e.shiftKey){
      e.preventDefault();
      runSearch();
    }
  });
  sendBtn.addEventListener('click', runSearch);

  // "Search" chip: focus the box, or run immediately if there's already a query
  document.querySelectorAll('.chip')[0].addEventListener('click', () => {
    if(promptInput.value.trim()){ runSearch(); } else { promptInput.focus(); }
  });

  // Top bar search icon: jump to the prompt box to start a web search
  document.getElementById('topSearchBtn').addEventListener('click', () => {
    promptInput.scrollIntoView({behavior:'smooth', block:'center'});
    promptInput.focus();
  });

  // ---- gallery: placeholder tiles (swap thumbGradient for real <img> in production) ----
  const gallery = [
    {title:'Neon skyline study', tag:'Art', hue:'260'},
    {title:'Weekend trail map', tag:'Explore', hue:'150'},
    {title:'Retro arcade cabinet', tag:'Games', hue:'330'},
    {title:'Sourdough crumb shot', tag:'Trending', hue:'40'},
    {title:'Low-poly mountain range', tag:'Art', hue:'200'},
    {title:'Market close heatmap', tag:'Trends', hue:'20'},
    {title:'Rooftop garden layout', tag:'Explore', hue:'110'},
    {title:'Synthwave album cover', tag:'Art', hue:'290'},
  ];
  const grid = document.getElementById('galleryGrid');
  function renderGallery(){
    grid.innerHTML = gallery.map(g => `
      <div class="tile">
        <div class="tile-thumb" style="background:linear-gradient(160deg, hsl(${g.hue} 70% 22%), hsl(${g.hue} 60% 10%));">
          <span class="badge">${g.tag}</span>
          <div class="overlay">
            <button aria-label="Download">
              <svg class="icon" viewBox="0 0 24 24"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="7 10 12 15 17 10"></polyline><line x1="12" y1="15" x2="12" y2="3"></line></svg>
            </button>
            <button aria-label="Open">
              <svg class="icon" viewBox="0 0 24 24"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"></path><polyline points="15 3 21 3 21 9"></polyline><line x1="10" y1="14" x2="21" y2="3"></line></svg>
            </button>
          </div>
        </div>
        <div class="tile-caption">${g.title}</div>
      </div>
    `).join('');
  }
  renderGallery();
  document.getElementById('refreshGallery').addEventListener('click', () => {
    gallery.sort(() => Math.random() - 0.5);
    renderGallery();
  });
</script>



</body></html>
