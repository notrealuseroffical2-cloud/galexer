<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Galexer</title>
<meta name="theme-color" content="#0A0A0D">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Lora:ital,wght@0,500;1,500&family=Fira+Code:wght@400;500&family=Playfair+Display:wght@600&family=Bebas+Neue&family=Pacifico&family=Space+Mono:wght@400;700&family=Caveat:wght@600&family=Righteous&family=Cormorant+Garamond:wght@600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0A0A0D;
  --surface:#141217;
  --surface-2:#1C1922;
  --surface-3:#241F30;
  --border:#2C2836;
  --border-2:#3A3450;
  --text:#EDEBF5;
  --muted:#9C98AC;
  --primary:#A855F7;
  --primary-dim:#5B21B6;
  --primary-ink:#1A0F2E;
  --primary-bg:rgba(168,85,247,0.12);
  --ring:rgba(168,85,247,0.35);
  --sidebar-w:220px;
}
*{box-sizing:border-box;margin:0;padding:0;}
html,body{height:100%;overflow:hidden;}
body{background:var(--bg);color:var(--text);font-family:'Inter',system-ui,sans-serif;font-size:14px;-webkit-font-smoothing:antialiased;}
button{font-family:inherit;cursor:pointer;border:none;background:none;}
a{color:inherit;text-decoration:none;}
::selection{background:var(--primary);color:var(--primary-ink);}
a:focus-visible,button:focus-visible,input:focus-visible{outline:2px solid var(--primary);outline-offset:2px;}

/* ── rising particles ── */
.bg-particles{position:fixed;inset:0;overflow:hidden;z-index:0;pointer-events:none;}
.particle{
  position:absolute;bottom:-40px;border-radius:50%;
  background:#FFFFFF;opacity:0;
  box-shadow:0 0 12px 4px rgba(255,255,255,0.6);
  animation-name:rise;animation-timing-function:linear;animation-iteration-count:infinite;
}
@keyframes rise{
  0%{transform:translateY(0) translateX(0);opacity:0;}
  8%{opacity:.8;}
  85%{opacity:.5;}
  100%{transform:translateY(-110vh) translateX(var(--drift,20px));opacity:0;}
}
@media(prefers-reduced-motion:reduce){.particle{display:none;}}

/* ── shell ── */
.shell{position:relative;z-index:1;display:flex;height:100vh;overflow:hidden;}

/* ══════════ SIDEBAR ══════════ */
.sidebar{
  width:var(--sidebar-w);flex-shrink:0;
  background:var(--surface);border-right:1px solid var(--border);
  display:flex;flex-direction:column;padding:8px 8px;gap:2px;
  overflow-y:auto;scrollbar-width:none;transition:width .25s ease;
}
.sidebar::-webkit-scrollbar{display:none;}
.sidebar.collapsed{width:52px;}

.sidebar-logo{
  display:flex;align-items:center;gap:8px;
  padding:10px 8px 14px;
  font-weight:700;font-size:1.25rem;letter-spacing:.15em;
  color:var(--primary);text-transform:uppercase;
  overflow:hidden;white-space:nowrap;
}
.sidebar.collapsed .sidebar-logo .logo-text{display:none;}

.sidebar-divider{height:1px;background:var(--border);margin:6px 2px;}

.nav-item{
  display:flex;align-items:center;gap:10px;
  padding:9px 10px;border-radius:10px;
  color:var(--muted);font-size:13px;font-weight:500;
  cursor:pointer;transition:background .15s,color .15s,border-color .15s;
  border:1.5px solid transparent;
  white-space:nowrap;overflow:hidden;
}
.nav-item:hover{background:var(--surface-2);color:var(--text);}
.nav-item.active{background:var(--primary-bg);color:var(--primary);border-color:var(--primary-dim);}
.nav-item svg{width:18px;height:18px;flex-shrink:0;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;}
.nav-item .nav-label{transition:opacity .15s;}
.sidebar.collapsed .nav-label{opacity:0;pointer-events:none;}
.nav-item[title]:hover::after{
  content:attr(title);
  position:fixed;left:60px;
  background:var(--surface-3);border:1px solid var(--border-2);
  color:var(--text);font-size:12px;padding:4px 10px;border-radius:6px;
  pointer-events:none;z-index:999;white-space:nowrap;
}

/* Browse expand panel */
.browse-expand{
  overflow:hidden;max-height:0;transition:max-height .3s ease;
  display:flex;flex-direction:column;gap:0;
}
.browse-expand.open{max-height:320px;}
.sidebar.collapsed .browse-expand{display:none;}
.bexp-toolbar{
  display:flex;align-items:center;gap:4px;
  padding:6px 4px;border-top:1px solid var(--border);
}
.bexp-addr{
  flex:1;background:var(--surface-2);border:1px solid var(--border);
  border-radius:6px;padding:4px 8px;color:var(--text);
  font-size:11px;font-family:inherit;
}
.bexp-addr:focus{outline:none;border-color:var(--primary);}
.bexp-btn{
  width:24px;height:24px;border-radius:5px;flex-shrink:0;
  display:flex;align-items:center;justify-content:center;
  color:var(--muted);background:var(--surface-2);border:1px solid var(--border);
  cursor:pointer;transition:all .12s;
}
.bexp-btn:hover{color:var(--text);border-color:var(--border-2);}
.bexp-btn svg{width:11px;height:11px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;}
.bexp-frame-wrap{
  flex:1;min-height:0;height:240px;position:relative;
}
.bexp-iframe{width:100%;height:100%;border:none;display:block;background:#fff;}
.bexp-blocked{
  position:absolute;bottom:6px;left:6px;right:6px;
  background:rgba(20,18,23,.9);border:1px solid var(--border);
  border-radius:7px;padding:7px 10px;font-size:11px;color:var(--muted);
  display:flex;align-items:center;justify-content:space-between;gap:8px;
  backdrop-filter:blur(4px);z-index:5;
}
.bexp-blocked button{
  background:var(--primary);color:var(--primary-ink);border:none;
  border-radius:999px;padding:3px 9px;font-size:10px;font-weight:700;cursor:pointer;
}

/* sidebar bottom */
.sidebar-bottom{margin-top:auto;padding-top:10px;display:flex;flex-direction:column;gap:4px;}
.cloak-label{
  font-size:10px;color:var(--muted);padding:0 6px;
  text-transform:uppercase;letter-spacing:.07em;
  white-space:nowrap;overflow:hidden;
}
.sidebar.collapsed .cloak-label{display:none;}
.cloak-opt{
  display:flex;align-items:center;gap:8px;padding:7px 10px;border-radius:8px;
  color:var(--muted);font-size:12px;cursor:pointer;
  border:1px solid transparent;transition:all .15s;
  white-space:nowrap;overflow:hidden;
}
.cloak-opt:hover{background:var(--surface-2);color:var(--text);}
.cloak-opt.active{background:var(--primary-bg);color:var(--primary);border-color:var(--primary-dim);}
.cloak-opt svg{width:13px;height:13px;flex-shrink:0;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;}
.sidebar.collapsed .cloak-opt .nav-label{display:none;}
.panic-btn{
  display:flex;align-items:center;justify-content:center;gap:6px;
  padding:8px 10px;border-radius:8px;margin-top:2px;
  background:rgba(220,38,38,.15);color:#F87171;
  border:1px solid rgba(220,38,38,.3);font-size:12px;font-weight:600;
  cursor:pointer;transition:all .15s;white-space:nowrap;overflow:hidden;
}
.panic-btn:hover{background:rgba(220,38,38,.25);}
.sidebar.collapsed .panic-btn .nav-label{display:none;}

/* toggle button */
.sidebar-toggle{
  position:absolute;top:50%;right:-12px;transform:translateY(-50%);
  width:22px;height:22px;border-radius:50%;z-index:10;
  background:var(--surface-2);border:1px solid var(--border-2);
  color:var(--muted);display:flex;align-items:center;justify-content:center;
  cursor:pointer;transition:all .15s;flex-shrink:0;
}
.sidebar-toggle:hover{background:var(--surface-3);color:var(--primary);}
.sidebar-toggle svg{width:10px;height:10px;stroke:currentColor;fill:none;stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round;transition:transform .25s;}
.sidebar.collapsed .sidebar-toggle svg{transform:rotate(180deg);}
.sidebar-wrap{position:relative;flex-shrink:0;}

/* ══════════ MAIN ══════════ */
.main{flex:1;min-width:0;display:flex;flex-direction:column;overflow:hidden;}

/* tabs */
.tabstrip{
  display:flex;align-items:flex-end;gap:4px;
  padding:8px 8px 0;flex-shrink:0;
  overflow-x:auto;scrollbar-width:thin;background:var(--bg);
}
.tabstrip::-webkit-scrollbar{height:3px;}
.tab{
  display:flex;align-items:center;gap:7px;
  min-width:120px;max-width:200px;flex-shrink:1;
  padding:8px 10px 8px 13px;border-radius:8px 8px 0 0;
  background:var(--surface);color:var(--muted);
  border:1px solid var(--border);border-bottom:none;
  cursor:pointer;transition:all .12s;
}
.tab.active{background:var(--surface-2);color:var(--primary);border-color:var(--primary-dim);border-top-width:2px;}
.tab-title{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:12.5px;font-weight:600;}
.tab-close{width:15px;height:15px;border-radius:50%;flex-shrink:0;display:flex;align-items:center;justify-content:center;transition:background .12s;}
.tab-close:hover{background:rgba(255,255,255,.14);color:var(--text);}
.new-tab-btn{
  width:32px;height:32px;border-radius:7px;flex-shrink:0;
  display:flex;align-items:center;justify-content:center;
  color:var(--muted);background:var(--surface);border:1px solid var(--border);transition:all .12s;
}
.new-tab-btn:hover{color:var(--text);border-color:var(--border-2);}

/* toolbar */
.toolbar{
  display:flex;align-items:center;gap:6px;padding:7px 8px;flex-shrink:0;
  background:var(--surface-2);border-bottom:1px solid var(--border);
}
.tool-btn{
  width:32px;height:32px;border-radius:7px;flex-shrink:0;
  display:flex;align-items:center;justify-content:center;
  color:var(--muted);background:var(--surface);border:1px solid var(--border);transition:all .12s;
}
.tool-btn:hover{color:var(--text);border-color:var(--border-2);}
.tool-btn:disabled{opacity:.35;pointer-events:none;}
.tool-btn svg{width:14px;height:14px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;}
.addr-box{
  flex:1;min-width:0;display:flex;align-items:center;gap:8px;
  background:var(--surface);border:1px solid var(--border);
  border-radius:7px;padding:0 12px;height:32px;transition:border-color .15s;
}
.addr-box:focus-within{border-color:var(--primary);}
.addr-box svg{width:13px;height:13px;stroke:var(--muted);fill:none;stroke-width:1.8;flex-shrink:0;}
.addr-box input{flex:1;min-width:0;background:transparent;border:none;color:var(--text);font-size:13px;height:100%;font-family:inherit;}
.addr-box input::placeholder{color:var(--muted);}

/* view area */
.view-area{flex:1;min-height:0;position:relative;background:var(--bg);}
.view{position:absolute;inset:0;overflow:hidden;}
.view.scroll{overflow-y:auto;}

/* ══════════ HOME PAGE ══════════ */
.home-page{
  min-height:100%;display:flex;flex-direction:column;
  align-items:center;padding:16vh 20px 40px;text-align:center;
}
.brand-mark{
  font-family:'Inter',sans-serif;font-weight:700;font-size:2.6rem;
  letter-spacing:.18em;margin:0 0 30px;color:var(--primary);text-transform:uppercase;
}
.home-search{
  width:100%;max-width:460px;display:flex;align-items:center;gap:10px;
  background:var(--surface);border:1px solid var(--border);
  border-radius:10px;padding:13px 16px;transition:border-color .15s,box-shadow .15s;
}
.home-search:focus-within{border-color:var(--primary);box-shadow:0 0 0 3px var(--ring);}
.home-search svg{color:var(--primary);flex-shrink:0;width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;}
.home-search input{flex:1;background:transparent;border:none;color:var(--text);font-size:14px;font-family:inherit;}
.home-search input::placeholder{color:var(--muted);}
.home-search input:focus{outline:none;}

.quick-tiles{margin-top:30px;display:flex;flex-wrap:wrap;justify-content:center;gap:28px;}
.qtile{display:flex;flex-direction:column;align-items:center;gap:8px;background:none;border:none;color:inherit;cursor:pointer;}
.qtile-icon{
  width:46px;height:46px;border-radius:13px;
  background:var(--surface-2);border:1px solid var(--border);
  display:flex;align-items:center;justify-content:center;transition:all .15s;
}
.qtile:hover .qtile-icon{border-color:var(--primary-dim);background:var(--primary-bg);}
.qtile-icon svg{width:21px;height:21px;stroke:var(--muted);fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;}
.qtile:hover .qtile-icon svg{stroke:var(--primary);}
.qtile-label{font-size:11px;font-weight:600;color:var(--muted);}
.qtile:hover .qtile-label{color:var(--text);}

.signature{display:flex;flex-direction:column;align-items:center;gap:10px;margin-top:56px;}
.sig-line-wrap{width:200px;max-width:60%;}
.sig-line{
  display:block;width:100%;height:2px;border-radius:2px;
  background:linear-gradient(90deg,transparent,var(--primary),transparent);
  transform-origin:left center;transform:scaleX(0);
  animation:sigLineGrow 10s ease-in-out infinite;
}
.sig-text{margin:0;font-size:1rem;letter-spacing:.02em;color:var(--muted);opacity:0;animation:sigTextFade 10s ease-in-out infinite;}
@keyframes sigLineGrow{0%{transform:scaleX(0);}8%{transform:scaleX(1);}45%{transform:scaleX(1);}51%{transform:scaleX(0);}100%{transform:scaleX(0);}}
@keyframes sigTextFade{0%{opacity:0;}8%{opacity:0;}12%{opacity:1;}42%{opacity:1;}45%{opacity:0;}100%{opacity:0;}}
@media(prefers-reduced-motion:reduce){.sig-line,.sig-text{animation:none;transform:scaleX(1);opacity:1;}}

/* ══════════ GAMES (gn-math) ══════════ */
.games-page{height:100%;background:var(--bg);padding:14px;display:flex;flex-direction:column;gap:12px;overflow:hidden;}
.games-header{display:flex;align-items:center;gap:10px;flex-wrap:wrap;flex-shrink:0;}
.games-title{font-size:1rem;font-weight:700;color:var(--primary);}
.games-count{font-size:12px;color:var(--muted);}
.games-search{
  flex:1;min-width:150px;max-width:300px;
  background:var(--surface);border:1px solid var(--border);
  border-radius:8px;padding:6px 12px;
  color:var(--text);font-size:13px;font-family:inherit;transition:border-color .15s;
}
.games-search:focus{outline:none;border-color:var(--primary);}
.games-search::placeholder{color:var(--muted);}
.games-sort{
  background:var(--surface);border:1px solid var(--border);
  color:var(--text);font-size:12px;padding:6px 10px;
  border-radius:8px;cursor:pointer;font-family:inherit;
}
.games-sort:focus{outline:none;border-color:var(--primary);}
.zone-grid-wrap{flex:1;overflow-y:auto;scrollbar-width:thin;}
.zone-grid-wrap::-webkit-scrollbar{width:4px;}
.zone-grid-wrap::-webkit-scrollbar-thumb{background:var(--border-2);border-radius:2px;}
.zone-grid{
  display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:10px;
}
.zone-card{
  background:var(--surface);border:1px solid var(--border);
  border-radius:10px;overflow:hidden;cursor:pointer;
  transition:border-color .15s,transform .12s,box-shadow .15s;
}
.zone-card:hover{border-color:var(--primary-dim);transform:translateY(-2px);box-shadow:0 6px 20px rgba(168,85,247,.15);}
.zone-thumb{width:100%;aspect-ratio:16/9;object-fit:cover;background:var(--surface-2);display:block;}
.zone-thumb-ph{
  width:100%;aspect-ratio:16/9;background:var(--surface-2);
  display:flex;align-items:center;justify-content:center;font-size:24px;
}
.zone-name{padding:5px 8px;font-size:11px;font-weight:600;color:var(--text);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}

/* zone viewer overlay */
.zone-viewer{
  position:absolute;inset:0;background:var(--bg);
  display:none;flex-direction:column;z-index:10;
}
.zone-viewer.open{display:flex;}
.zone-top{
  display:flex;align-items:center;gap:8px;padding:7px 10px;
  background:var(--surface-2);border-bottom:1px solid var(--border);flex-shrink:0;flex-wrap:wrap;
}
.zone-top-title{flex:1;font-size:13px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:80px;}
.zone-top-sub{font-size:11px;color:var(--muted);flex-shrink:0;}
.zone-action{
  padding:5px 10px;border-radius:6px;font-size:11px;font-weight:600;
  background:var(--surface);border:1px solid var(--border);color:var(--muted);
  cursor:pointer;transition:all .12s;flex-shrink:0;
}
.zone-action:hover{border-color:var(--border-2);color:var(--text);}
.zone-action.primary{background:var(--primary-bg);border-color:var(--primary-dim);color:var(--primary);}
.zone-iframe{flex:1;border:none;width:100%;display:block;background:#111;}

/* skeleton shimmer */
.zone-skel{
  background:linear-gradient(90deg,var(--surface) 25%,var(--surface-2) 50%,var(--surface) 75%);
  background-size:200% 100%;animation:skel 1.4s linear infinite;
  border-radius:10px;
}
.zone-skel-thumb{width:100%;aspect-ratio:16/9;}
.zone-skel-name{height:20px;margin:6px 8px;border-radius:4px;width:70%;}
@keyframes skel{0%{background-position:200% 0;}100%{background-position:-200% 0;}}

/* ══════════ GENERIC PANELS ══════════ */
.panel-page{
  min-height:100%;display:flex;flex-direction:column;
  align-items:center;justify-content:center;
  gap:12px;color:var(--muted);padding:40px;text-align:center;
}
.panel-page h2{font-size:1.2rem;font-weight:600;color:var(--text);}
.panel-page p{font-size:13px;max-width:320px;line-height:1.7;}
.panel-launch{
  margin-top:8px;padding:10px 20px;border-radius:8px;
  background:var(--primary-bg);border:1px solid var(--primary-dim);
  color:var(--primary);font-size:13px;font-weight:600;cursor:pointer;transition:all .15s;
}
.panel-launch:hover{background:rgba(168,85,247,.22);}

/* ══════════ IFRAME (external URL tab) ══════════ */
.ext-frame-note{
  position:absolute;left:14px;right:14px;bottom:14px;z-index:5;
  display:flex;align-items:center;justify-content:space-between;gap:12px;
  background:rgba(20,18,23,.94);border:1px solid var(--border);
  border-radius:10px;padding:10px 14px;font-size:12px;color:var(--muted);
  backdrop-filter:blur(6px);flex-wrap:wrap;
}
.ext-frame-note button{
  background:var(--primary);color:var(--primary-ink);border:none;
  border-radius:999px;padding:6px 12px;font-size:11.5px;font-weight:700;
  cursor:pointer;flex-shrink:0;
}
.ext-frame-note button:hover{filter:brightness(1.1);}

/* FAB */
.fab{
  position:fixed;left:20px;bottom:20px;z-index:6;width:48px;height:48px;border-radius:50%;
  background:var(--surface);border:2px solid var(--primary);color:var(--primary);
  display:flex;align-items:center;justify-content:center;
  box-shadow:0 8px 24px -8px rgba(0,0,0,.6);cursor:pointer;transition:all .15s;
}
.fab:hover{background:var(--surface-2);}
.fab svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;}
</style>
</head>
<body>

<div class="bg-particles" id="bgParticles" aria-hidden="true"></div>

<div class="shell">

  <!-- ══════════ SIDEBAR WRAPPER (for toggle button positioning) ══════════ -->
  <div class="sidebar-wrap">
    <nav class="sidebar" id="sidebar">
      <div class="sidebar-logo">
        <span>G</span><span class="logo-text" style="font-size:1rem;font-weight:600;color:var(--text);letter-spacing:.05em;text-transform:none;">alexer</span>
      </div>

      <div class="nav-item active" data-panel="home" title="Home" onclick="showPanel('home',this)">
        <svg viewBox="0 0 24 24"><path d="M3 12l9-9 9 9"/><path d="M9 21V12h6v9"/></svg>
        <span class="nav-label">Home</span>
      </div>
      <div class="nav-item" data-panel="play" title="Play" onclick="showPanel('play',this)">
        <svg viewBox="0 0 24 24"><rect x="2" y="6" width="20" height="12" rx="3"/><circle cx="8" cy="12" r="1" fill="currentColor" stroke="none"/><circle cx="12" cy="12" r="1" fill="currentColor" stroke="none"/><circle cx="16" cy="12" r="1" fill="currentColor" stroke="none"/></svg>
        <span class="nav-label">Play</span>
      </div>
      <div class="nav-item" data-panel="apps" title="Apps" onclick="showPanel('apps',this)">
        <svg viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg>
        <span class="nav-label">Apps</span>
      </div>
      <div class="nav-item" data-panel="chat" title="Chat" onclick="showPanel('chat',this)">
        <svg viewBox="0 0 24 24"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
        <span class="nav-label">Chat</span>
      </div>
      <div class="nav-item" data-panel="ai" title="AI" onclick="showPanel('ai',this)">

<script>
/* ═══ PARTICLES (original style) ═══ */
(function(){
  const f=document.getElementById('bgParticles');
  const count=22;
  for(let i=0;i<count;i++){
    const p=document.createElement('div');
    p.className='particle';
    const size=3+Math.random()*6;
    const left=Math.random()*100;
    const dur=14+Math.random()*16;
    const delay=-Math.random()*dur;
    const drift=(Math.random()*80-40).toFixed(0)+'px';
    p.style.cssText=`width:${size}px;height:${size}px;left:${left}%;--drift:${drift};animation-duration:${dur}s;animation-delay:${delay}s;`;
    f.appendChild(p);
  }
})();

/* ═══ SIDEBAR TOGGLE ═══ */
function toggleSidebar(){
  const sb=document.getElementById('sidebar');
  sb.classList.toggle('collapsed');
}

/* ═══ BROWSE EXPAND (inline mini-browser in sidebar) ═══ */
let browseOpen=false;
function toggleBrowseExpand(navEl){
  browseOpen=!browseOpen;
  const exp=document.getElementById('browseExpand');
  const chev=document.getElementById('browseChevron');
  exp.classList.toggle('open',browseOpen);
  chev.style.transform=browseOpen?'rotate(180deg)':'rotate(0deg)';
  // also mark nav active
  document.querySelectorAll('.nav-item').forEach(x=>x.classList.remove('active'));
  navEl.classList.add('active');
}
function bexpNav(dir){
  const f=document.getElementById('bexpFrame');if(!f)return;
  try{
    if(dir==='back')f.contentWindow.history.back();
    else if(dir==='fwd')f.contentWindow.history.forward();
    else{f.src=f.src;}
  }catch(e){}
}
function bexpGo(e){
  if(e.key==='Enter')bexpNavUrl(e.target.value);
}
function bexpNavUrl(raw){
  let url=raw.trim();if(!url)return;
  if(!looksUrl(url))url='https://duckduckgo.com/?q='+encodeURIComponent(url);
  else if(!/^https?:\/\//i.test(url))url='https://'+url;
  const f=document.getElementById('bexpFrame');
  const addr=document.getElementById('bexpAddr');
  if(f)f.src=url;
  if(addr)addr.value=url;
}
document.getElementById('bexpFrame').addEventListener('load',function(){
  try{
    const loc=this.contentWindow?.location?.href;
    const addr=document.getElementById('bexpAddr');
    if(loc&&loc!=='about:blank'&&addr)addr.value=loc;
  }catch(e){}
});

/* ═══ CLOAK + PANIC ═══ */
const CLOAKS={
  none:{title:'Galexer',fav:''},
  gdocs:{title:'Untitled document – Google Docs',fav:'https://ssl.gstatic.com/docs/documents/images/kix-favicon7.ico'},
  gclass:{title:'Classes – Google Classroom',fav:'https://ssl.gstatic.com/classroom/favicon.png'},
  khan:{title:'Khan Academy | Free Online Courses',fav:'https://cdn.kastatic.org/images/favicon.ico'},
};
let cloakLink=null;
function setCloak(k,el){
  document.querySelectorAll('.cloak-opt').forEach(x=>x.classList.remove('active'));
  el.classList.add('active');
  const c=CLOAKS[k];
  document.title=c.title;
  if(!cloakLink){cloakLink=document.createElement('link');cloakLink.rel='icon';document.head.appendChild(cloakLink);}
  cloakLink.href=c.fav;
}
function panicTab(){
  document.title='Classes – Google Classroom';
  window.location.replace('https://classroom.google.com');
}

/* ═══ TAB ENGINE ═══ */
let seq=1,tabs=[],activeId=null;

function looksUrl(s){
  if(/^https?:\/\//i.test(s))return true;
  return /^[a-z0-9-]+(\.[a-z0-9-]+)+(:\d+)?(\/[^\s]*)?$/i.test(s)&&!s.includes(' ');
}
function resolveUrl(raw){
  const q=raw.trim();if(!q)return null;
  if(looksUrl(q)){
    const url=/^https?:\/\//i.test(q)?q:'https://'+q;
    let lbl;try{lbl=new URL(url).hostname.replace(/^www\./,'');}catch(e){lbl=q;}
    return{url,title:lbl};
  }
  return{url:'https://duckduckgo.com/?q='+encodeURIComponent(q),title:q};
}
function newTab(dest){
  const tab={id:seq++,title:dest?dest.title:'New Tab',url:dest?dest.url:null,panel:'home'};
  tabs.push(tab);activeId=tab.id;renderTabs();renderView();
}
function closeTab(id){
  const i=tabs.findIndex(t=>t.id===id);if(i===-1)return;
  tabs.splice(i,1);
  if(!tabs.length){newTab();return;}
  if(activeId===id)activeId=(tabs[i]||tabs[i-1]).id;
  renderTabs();renderView();
}
function switchTab(id){activeId=id;renderTabs();renderView();}
function activeTab(){return tabs.find(t=>t.id===activeId);}

function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}

function renderTabs(){
  const strip=document.getElementById('tabstrip');
  strip.innerHTML=tabs.map(t=>`
    <div class="tab${t.id===activeId?' active':''}" onclick="switchTab(${t.id})">
      <span class="tab-title">${esc(t.title)}</span>
      <span class="tab-close" onclick="event.stopPropagation();closeTab(${t.id})">
        <svg style="width:11px;height:11px;stroke:currentColor;fill:none;stroke-width:2;" viewBox="0 0 24 24"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
      </span>
    </div>
  `).join('')+`<button class="new-tab-btn" onclick="newTab()" title="New tab"><svg style="width:13px;height:13px;stroke:currentColor;fill:none;stroke-width:2;" viewBox="0 0 24 24"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg></button>`;
}

function renderView(){
  const tab=activeTab();
  const va=document.getElementById('viewArea');
  va.innerHTML='';
  if(!tab)return;
  document.getElementById('addrInput').value=tab.url||'';
  const bk=document.getElementById('backBtn');
  const fw=document.getElementById('fwdBtn');

  const panel=tab.panel||'url';

  if(panel==='home'){
    bk.disabled=true;fw.disabled=true;
    renderHomeView(va);
    document.getElementById('reloadBtn').onclick=()=>renderView();
    return;
  }
  if(panel==='play'){
    bk.disabled=true;fw.disabled=true;
    renderPlayView(va);
    return;
  }
  if(['ai','chat','listen','watch','apps'].includes(panel)){
    bk.disabled=true;fw.disabled=true;
    renderGenericPanel(va,tab);
    return;
  }
  // external URL
  bk.disabled=false;fw.disabled=false;
  renderExtFrame(va,tab);
}

/* ─── home ─── */
function renderHomeView(va){
  const node=document.getElementById('tmplHome').content.cloneNode(true);
  const inp=node.querySelector('.hs-input');
  inp.addEventListener('keydown',e=>{
    if(e.key==='Enter'){const d=resolveUrl(inp.value);if(d)navigateTo(d);}
  });
  node.querySelectorAll('.qtile').forEach(b=>{
    b.addEventListener('click',()=>navigateTo({url:b.dataset.url,title:b.dataset.title}));
  });
  // rotating sig font
  const FONTS=["'Inter',sans-serif","'Lora',serif","'Fira Code',monospace","'Playfair Display',serif","'Bebas Neue',sans-serif","'Pacifico',cursive","'Space Mono',monospace","'Caveat',cursive","'Righteous',sans-serif","'Cormorant Garamond',serif"];
  let fi=Math.floor(Math.random()*FONTS.length);
  const sl=node.querySelector('.sig-line');
  const st=node.querySelector('.sig-text');
  if(sl&&st){
    st.style.fontFamily=FONTS[fi];
    sl.addEventListener('animationiteration',()=>{fi=(fi+1)%FONTS.length;st.style.fontFamily=FONTS[fi];});
  }
  va.appendChild(node);
}

/* ─── external URL frame ─── */
function renderExtFrame(va,tab){
  const wrap=document.createElement('div');
  wrap.className='view';wrap.style.overflow='hidden';
  const iframe=document.createElement('iframe');
  iframe.src=tab.url;
  iframe.setAttribute('referrerpolicy','no-referrer');
  iframe.style.cssText='width:100%;height:100%;border:none;display:block;';
  wrap.appendChild(iframe);
  const note=document.createElement('div');
  note.className='ext-frame-note';
  note.innerHTML=`<span>Some sites block iframes. If this looks blank, open it directly.</span><button onclick="window.open('${esc(tab.url)}','_blank','noopener')">Open directly ↗</button><button onclick="this.parentElement.style.display='none'">✕</button>`;
  wrap.appendChild(note);
  va.appendChild(wrap);
  document.getElementById('reloadBtn').onclick=()=>{iframe.src=tab.url;};
  document.getElementById('backBtn').onclick=()=>{try{iframe.contentWindow.history.back();}catch(e){}};
  document.getElementById('fwdBtn').onclick=()=>{try{iframe.contentWindow.history.forward();}catch(e){}};
}

/* ─── generic panels ─── */
const PANEL_META={
  ai:{svgPath:'<rect x="3" y="8" width="18" height="13" rx="2"/><path d="M8 8V5a4 4 0 0 1 8 0v3"/><line x1="9" y1="14" x2="9" y2="14"/><line x1="15" y1="14" x2="15" y2="14"/><path d="M9 17c1 1 5 1 6 0"/>',title:'AI Assistant',body:'Chat with AI right in your browser.',url:'https://claude.ai',label:'Open Claude'},
  chat:{svgPath:'<path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/>',title:'Chat',body:'Jump into Discord, Slack or WhatsApp.',url:'https://discord.com',label:'Open Discord'},
  listen:{svgPath:'<path d="M3 18v-6a9 9 0 0 1 18 0v6"/><path d="M21 19a2 2 0 0 1-2 2h-1a2 2 0 0 1-2-2v-3a2 2 0 0 1 2-2h3zM3 19a2 2 0 0 0 2 2h1a2 2 0 0 0 2-2v-3a2 2 0 0 0-2-2H3z"/>',title:'Listen',body:'Stream music and podcasts.',url:'https://open.spotify.com',label:'Open Spotify'},
  watch:{svgPath:'<rect x="2" y="7" width="20" height="15" rx="2"/><polyline points="17 2 12 7 7 2"/>',title:'Watch',body:'Watch videos and streams.',url:'https://www.youtube.com',label:'Open YouTube'},

function renderGenericPanel(va,tab){
  const node=document.getElementById('tmplGeneric').content.cloneNode(true);
  va.appendChild(node);
  const m=PANEL_META[tab.panel]||{svgPath:'',title:tab.panel,body:'',url:'',label:''};
  const c=document.getElementById('genericContent');
  if(!c)return;
  c.innerHTML=`
    <svg viewBox="0 0 24 24" style="width:52px;height:52px;stroke:var(--primary);fill:none;stroke-width:1.3;stroke-linecap:round;stroke-linejoin:round;">${m.svgPath}</svg>

/* ═══ PANEL SWITCHING ═══ */
function showPanel(panel,el){
  document.querySelectorAll('.nav-item').forEach(x=>x.classList.remove('active'));
  el.classList.add('active');
  const tab=activeTab();if(!tab)return;
  if(panel==='home'){tab.url=null;tab.panel='home';tab.title='New Tab';}
  else if(panel==='play'){tab.url='play';tab.panel='play';tab.title='Play';}
  else{tab.url=panel;tab.panel=panel;tab.title=panel.charAt(0).toUpperCase()+panel.slice(1);}
  renderTabs();renderView();
  document.getElementById('addrInput').value=tab.url||'';
}
function navigateTo(dest){
  const tab=activeTab();if(!tab||!dest)return;
  tab.url=dest.url;tab.title=dest.title;tab.panel=undefined;
  renderTabs();renderView();
}

/* ═══ GAMES (gn-math) ═══ */
let zonesData=[],zonesLoaded=false,activeZone=null;

const COVER_URL='https://cdn.jsdelivr.net/gh/gn-math/covers@main';
const HTML_URL='https://cdn.jsdelivr.net/gh/gn-math/html@main';
const ZONES_URLS=[
  'https://cdn.jsdelivr.net/gh/gn-math/assets@main/zones.json',
  'https://cdn.jsdelivr.net/gh/gn-math/assets@latest/zones.json',
  'https://cdn.jsdelivr.net/gh/gn-math/assets@master/zones.json',
];

function renderPlayView(va){
  const node=document.getElementById('tmplPlay').content.cloneNode(true);
  va.appendChild(node);
  document.getElementById('zonesSearch').addEventListener('input',filterZones);
  document.getElementById('zonesSort').addEventListener('change',filterZones);
  if(!zonesLoaded)loadZones();
  else renderZoneGrid();
}

async function loadZones(){
  const el=document.getElementById('zonesCount');
  if(el)el.textContent='Loading…';
  for(const url of ZONES_URLS){
    try{
      const r=await fetch(url+'?t='+Date.now());
      if(!r.ok)continue;
      const data=await r.json();
      if(!Array.isArray(data)||!data.length)continue;
      zonesData=data;
      zonesLoaded=true;
      renderZoneGrid();
      return;
    }catch(e){}
  }
  const el2=document.getElementById('zonesCount');
  if(el2)el2.textContent='Failed to load — check network';
}

function resolveZoneUrl(z){
  return z.url.replace('{COVER_URL}',COVER_URL).replace('{HTML_URL}',HTML_URL);
}
function resolveZoneCover(z){
  return (z.cover||'').replace('{COVER_URL}',COVER_URL).replace('{HTML_URL}',HTML_URL);
}

function renderZoneGrid(list){
  const grid=document.getElementById('zoneGrid');
  const cnt=document.getElementById('zonesCount');
  if(!grid)return;
  if(!list)list=zonesData;
  if(cnt)cnt.textContent=list.length+' zones';
  grid.innerHTML='';
  list.forEach(z=>{
    const card=document.createElement('div');
    card.className='zone-card';
    // skeleton placeholder
    card.innerHTML=`<div class="zone-skel zone-skel-thumb" id="zs-${z.id}"></div><div class="zone-name">${esc(z.name||'Zone '+z.id)}</div>`;
    card.onclick=()=>openZone(z);
    grid.appendChild(card);
    // lazy cover
    const cover=resolveZoneCover(z);
    if(cover){
      const img=new Image();
      img.onload=()=>{
        const ph=document.getElementById('zs-'+z.id);
        if(ph){const i=document.createElement('img');i.className='zone-thumb';i.src=cover;i.alt=z.name||'';ph.replaceWith(i);}
      };
      img.src=cover;
    }
  });
}

function filterZones(){
  const q=(document.getElementById('zonesSearch')?.value||'').toLowerCase().trim();
  const sort=document.getElementById('zonesSort')?.value||'name';
  let list=[...zonesData];
  if(q)list=list.filter(z=>(z.name||'').toLowerCase().includes(q));
  if(sort==='name')list.sort((a,b)=>(a.name||'').localeCompare(b.name||''));
  else if(sort==='id')list.sort((a,b)=>b.id-a.id);
  renderZoneGrid(list);
}

function openZone(z){
  activeZone=z;
  const viewer=document.getElementById('zoneViewer');
  if(!viewer)return;
  document.getElementById('zvName').textContent=z.name||'Zone '+z.id;
  document.getElementById('zvAuthor').textContent=z.author?'by '+z.author:'';
  viewer.classList.add('open');

  const iframe=document.getElementById('zoneIframe');
  // Reset fully
  iframe.removeAttribute('src');
  iframe.removeAttribute('srcdoc');

  const url=resolveZoneUrl(z);

  if(z.url.startsWith('http')){
    // external URL — just load directly
    iframe.src=z.url;
  } else {
    // hosted HTML — fetch and write into iframe via about:blank document.write
    // This is the only approach that reliably works around CSP srcdoc blocking
    fetch(url+'?t='+Date.now())
      .then(r=>{
        if(!r.ok)throw new Error('HTTP '+r.status);
        return r.text();
      })
      .then(html=>{
        iframe.src='about:blank';
        // Wait one tick for the blank frame to settle, then write
        setTimeout(()=>{
          try{
            const doc=iframe.contentDocument||iframe.contentWindow.document;
            doc.open();
            doc.write(html);
            doc.close();
          }catch(e){
            // Fallback: srcdoc
            iframe.srcdoc=html;
          }
        },50);
      })
      .catch(err=>{
        // Last resort: direct src
        iframe.src=url;
      });
  }
}

function closeZoneViewer(){
  const v=document.getElementById('zoneViewer');
  if(v)v.classList.remove('open');
  const f=document.getElementById('zoneIframe');
  if(f){f.src='about:blank';f.removeAttribute('srcdoc');}
  activeZone=null;
}
function zvNewTab(){
  if(!activeZone)return;
  if(activeZone.url.startsWith('http')){window.open(activeZone.url,'_blank','noopener');return;}
  fetch(resolveZoneUrl(activeZone)+'?t='+Date.now()).then(r=>r.text()).then(html=>{
    const w=window.open('about:blank','_blank','noopener');
    if(w){w.document.open();w.document.write(html);w.document.close();}
  });
}
function zvFullscreen(){
  const f=document.getElementById('zoneIframe');
  if(f&&f.requestFullscreen)f.requestFullscreen().catch(()=>{});
}
function zvDownload(){
  if(!activeZone)return;
  fetch(resolveZoneUrl(activeZone)+'?t='+Date.now()).then(r=>r.text()).then(txt=>{
    const a=Object.assign(document.createElement('a'),{
      href:URL.createObjectURL(new Blob([txt],{type:'text/html'})),
      download:(activeZone.name||'zone')+'.html'
    });
    document.body.appendChild(a);a.click();document.body.removeChild(a);
  });
}

document.getElementById('addrInput').addEventListener('keydown',function(e){
  if(e.key==='Enter'){const d=resolveUrl(this.value);if(d)navigateTo(d);}
});
document.getElementById('newTabBtn2').addEventListener('click',()=>newTab());
document.getElementById('fullBtn').addEventListener('click',()=>{
  if(!document.fullscreenElement)document.documentElement.requestFullscreen().catch(()=>{});
  else document.exitFullscreen();
});

newTab();
