<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Galexer — Educational Books</title>
<meta name="description" content="Galexer: a minimal integrated-browser template with tabs, a toolbar, and a DuckDuckGo-powered new-tab page.">
<meta name="theme-color" content="#0A0A0D">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Lora:ital,wght@0,500;1,500&family=Fira+Code:wght@400;500&family=Playfair+Display:wght@600&family=Bebas+Neue&family=Pacifico&family=Space+Mono:wght@400;700&family=Caveat:wght@600&family=Righteous&family=Cormorant+Garamond:wght@600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0A0A0D;
    --surface:#141217;
    --surface-2:#1C1922;
    --border:#2C2836;
    --text:#EDEBF5;
    --muted:#9C98AC;
    --primary:#A855F7;
    --primary-ink:#1A0F2E;
    --ring:rgba(168,85,247,0.45);
  }
  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{
    margin:0; background:var(--bg); color:var(--text);
    font-family:'Inter',system-ui,sans-serif; font-size:14px;
    -webkit-font-smoothing:antialiased;
  }
  button{font-family:inherit; cursor:pointer;}
  a{color:inherit; text-decoration:none;}
  ::selection{background:var(--primary); color:var(--primary-ink);}
  a:focus-visible, button:focus-visible, input:focus-visible, textarea:focus-visible{
    outline:2px solid var(--primary); outline-offset:2px;
  }
  .icon{width:15px; height:15px; stroke:currentColor; fill:none; stroke-width:1.8; stroke-linecap:round; stroke-linejoin:round; display:block;}

  /* ---------- rising particle field ---------- */
  .bg-particles{ position:fixed; inset:0; overflow:hidden; z-index:0; pointer-events:none; }
  .particle{
    position:absolute; bottom:-40px; border-radius:50%; background:#FFFFFF;
    opacity:0; box-shadow:0 0 12px 4px rgba(255,255,255,0.6);
    animation-name:rise; animation-timing-function:linear; animation-iteration-count:infinite;
  }
  @keyframes rise{
    0%{ transform:translateY(0) translateX(0); opacity:0; }
    8%{ opacity:.8; }
    85%{ opacity:.5; }
    100%{ transform:translateY(-110vh) translateX(var(--drift,20px)); opacity:0; }
  }
  @media (prefers-reduced-motion: reduce){ .particle{animation:none; display:none;} }

  /* ---------- app shell ---------- */
  .app{ position:relative; z-index:1; display:flex; flex-direction:column; height:100vh; overflow:hidden; }

  /* ---------- tab strip ---------- */
  .tabstrip{
    display:flex; align-items:center; gap:6px; padding:8px 8px 0; flex-shrink:0;
    overflow-x:auto; scrollbar-width:thin;
  }
  .tabstrip::-webkit-scrollbar{height:4px;}
  .tab{
    display:flex; align-items:center; gap:8px; width:190px; min-width:120px; flex-shrink:1;
    padding:9px 10px 9px 14px; border-radius:8px 8px 0 0; cursor:pointer;
    background:var(--surface); color:var(--muted); border:1px solid var(--border); border-bottom:none;
  }
  .tab.active{ background:var(--surface-2); color:var(--primary); border-color:var(--primary); border-top-width:2px; }
  .tab .tab-title{ flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; font-size:13px; font-weight:600; }
  .tab .tab-close{
    width:16px; height:16px; border-radius:50%; flex-shrink:0; display:flex; align-items:center;
    justify-content:center; color:inherit; background:transparent;
  }
  .tab .tab-close:hover{ background:rgba(255,255,255,0.12); color:var(--text); }
  .new-tab-btn{
    width:34px; height:34px; border-radius:8px; flex-shrink:0;
    display:flex; align-items:center; justify-content:center; color:var(--muted);
    background:var(--surface); border:1px solid var(--border);
  }
  .new-tab-btn:hover{ color:var(--text); border-color:#463A5C; }

  /* ---------- toolbar ---------- */
  .toolbar{
    display:flex; align-items:center; gap:8px; padding:9px 10px; flex-shrink:0;
    border-bottom:1px solid var(--border);
  }
  .tool-btn{
    width:34px; height:34px; border-radius:8px; flex-shrink:0; display:flex; align-items:center;
    justify-content:center; color:var(--muted); background:var(--surface); border:1px solid var(--border);
  }
  .tool-btn:hover{ color:var(--text); border-color:#463A5C; }
  .tool-btn:disabled{ opacity:.4; cursor:default; }
  .tool-btn:disabled:hover{ color:var(--muted); border-color:var(--border); }
  .addr-box{
    flex:1; min-width:0; display:flex; align-items:center; gap:9px; background:var(--surface);
    border:1px solid var(--border); border-radius:8px; padding:0 14px; height:34px;
    transition:border-color .15s ease;
  }
  .addr-box:focus-within{ border-color:var(--primary); }
  .addr-box input{ flex:1; min-width:0; background:transparent; border:none; color:var(--text); font-size:13.5px; height:100%; }
  .addr-box input::placeholder{ color:var(--muted); }
  .toolbar-spacer{ flex-shrink:0; width:1px; height:20px; background:var(--border); margin:0 2px; }

  /* ---------- view area ---------- */
  .view-area{ flex:1; min-height:0; position:relative; }
  .view{ position:absolute; inset:0; overflow-y:auto; }
  .view iframe{ width:100%; height:100%; border:none; display:block; background:#fff; }

  .frame-note{
    position:absolute; left:14px; right:14px; bottom:14px; z-index:5;
    display:flex; align-items:center; justify-content:space-between; gap:12px; flex-wrap:wrap;
    background:rgba(20,18,23,0.94); border:1px solid var(--border); border-radius:10px;
    padding:10px 14px; font-size:12px; color:var(--muted); backdrop-filter:blur(6px);
  }
  .frame-note button{
    display:flex; align-items:center; gap:6px; background:var(--primary); color:var(--primary-ink);
    border:none; border-radius:999px; padding:6px 12px; font-size:11.5px; font-weight:600; flex-shrink:0;
  }
  .frame-note button:hover{ filter:brightness(1.08); }

  /* ---------- home (new tab) page ---------- */
  .hero{
    min-height:100%; display:flex; flex-direction:column; align-items:center;
    padding:16vh 20px 40px; text-align:center;
  }
  .brand-mark{
    font-family:'Inter',sans-serif; font-weight:700; font-size:2.6rem; letter-spacing:.18em;
    margin:0 0 30px; color:var(--primary); text-transform:uppercase;
  }
  .search-box{
    width:100%; max-width:460px; display:flex; align-items:center; gap:10px;
    background:var(--surface); border:1px solid var(--border); border-radius:10px;
    padding:13px 16px; transition:border-color .15s ease;
  }
  .search-box:focus-within{ border-color:var(--primary); box-shadow:0 0 0 3px var(--ring); }
  .search-box .icon{ color:var(--primary); flex-shrink:0; }
  .search-box input{ flex:1; background:transparent; border:none; color:var(--text); font-size:14px; }
  .search-box input::placeholder{ color:var(--muted); }

  .launcher{ margin-top:30px; }
  .launcher-grid{ display:flex; flex-wrap:wrap; justify-content:center; gap:30px; }
  .launch-tile{
    display:flex; flex-direction:column; align-items:center; gap:8px; background:none; border:none; color:inherit;
  }
  .launch-tile .tile-icon{ color:var(--muted); }
  .launch-tile .tile-icon svg{ width:26px; height:26px; }
  .launch-tile:hover .tile-icon{ color:var(--text); }
  .launch-tile .tile-label{ font-size:11.5px; font-weight:600; color:var(--muted); }
  .launch-tile:hover .tile-label{ color:var(--text); }

  /* ---------- signature: growing line + rotating-font credit ---------- */
  .signature{ display:flex; flex-direction:column; align-items:center; gap:10px; margin-top:56px; }
  .sig-line-wrap{ width:200px; max-width:60%; }
  .sig-line{
    display:block; width:100%; height:2px; border-radius:2px;
    background:linear-gradient(90deg, transparent, var(--primary), transparent);
    transform-origin:left center; transform:scaleX(0);
    animation:sigLineGrow 10s ease-in-out infinite;
  }
  .sig-text{
    margin:0; font-size:1rem; letter-spacing:.02em; color:var(--muted);
    opacity:0; animation:sigTextFade 10s ease-in-out infinite;
  }
  @keyframes sigLineGrow{
    0%{ transform:scaleX(0); } 8%{ transform:scaleX(1); }
    45%{ transform:scaleX(1); } 51%{ transform:scaleX(0); } 100%{ transform:scaleX(0); }
  }
  @keyframes sigTextFade{
    0%{ opacity:0; } 8%{ opacity:0; } 12%{ opacity:1; }
    42%{ opacity:1; } 45%{ opacity:0; } 100%{ opacity:0; }
  }
  @media (prefers-reduced-motion: reduce){ .sig-line, .sig-text{ animation:none; transform:scaleX(1); opacity:1; } }

  /* ---------- floating action button ---------- */
  .fab{
    position:fixed; left:20px; bottom:20px; z-index:6; width:48px; height:48px; border-radius:50%;
    background:var(--surface); border:2px solid var(--primary); color:var(--primary);
    display:flex; align-items:center; justify-content:center; box-shadow:0 8px 24px -8px rgba(0,0,0,0.6);
  }
  .fab:hover{ background:var(--surface-2); }
  .fab .icon{ width:20px; height:20px; }

  @media (max-width:640px){
    .tab{ width:130px; }
    .brand-mark{ font-size:1.9rem; letter-spacing:.1em; }
    .launcher-grid{ gap:20px 22px; }
  }
</style>
</head>
<body>

<div class="bg-particles" id="bgParticles" aria-hidden="true"></div>

<div class="app">
  <div class="tabstrip" id="tabstrip"></div>

  <div class="toolbar">
    <button class="tool-btn" id="backBtn" aria-label="Back">
      <svg class="icon" viewBox="0 0 24 24"><polyline points="15 18 9 12 15 6"></polyline></svg>
    </button>
    <button class="tool-btn" id="fwdBtn" aria-label="Forward">
      <svg class="icon" viewBox="0 0 24 24"><polyline points="9 18 15 12 9 6"></polyline></svg>
    </button>
    <button class="tool-btn" id="reloadBtn" aria-label="Reload">
      <svg class="icon" viewBox="0 0 24 24"><polyline points="23 4 23 10 17 10"></polyline><path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"></path></svg>
    </button>
    <button class="tool-btn" id="homeBtn" aria-label="Home">
      <svg class="icon" viewBox="0 0 24 24"><path d="M3 12l9-9 9 9"></path><path d="M9 21V12h6v9"></path></svg>
    </button>
    <div class="addr-box">
      <input type="text" id="addressInput" placeholder="Search or enter URL" aria-label="Address bar">
    </div>
    <div class="toolbar-spacer"></div>
    <button class="tool-btn" id="fullscreenBtn" aria-label="Fullscreen">
      <svg class="icon" viewBox="0 0 24 24"><path d="M8 3H5a2 2 0 0 0-2 2v3"></path><path d="M21 8V5a2 2 0 0 0-2-2h-3"></path><path d="M3 16v3a2 2 0 0 0 2 2h3"></path><path d="M16 21h3a2 2 0 0 0 2-2v-3"></path></svg>
    </button>
    <button class="tool-btn" id="extensionsBtn" aria-label="Extensions">
      <svg class="icon" viewBox="0 0 24 24"><path d="M20 10h-2V8a2 2 0 0 0-2-2h-2V4a2 2 0 1 0-4 0v2H8a2 2 0 0 0-2 2v2H4a2 2 0 1 0 0 4h2v2a2 2 0 0 0 2 2h2v2a2 2 0 1 0 4 0v-2h2a2 2 0 0 0 2-2v-2h2a2 2 0 1 0 0-4z"></path></svg>
    </button>
    <button class="tool-btn" id="settingsBtn" aria-label="Settings">
      <svg class="icon" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"></circle><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"></path></svg>
    </button>
  </div>

  <div class="view-area" id="viewArea"></div>
</div>

<button class="fab" id="fabHome" aria-label="New tab">
  <svg class="icon" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"></circle><line x1="2" y1="12" x2="22" y2="12"></line><path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"></path></svg>
</button>

<template id="homeTemplate">
  <section class="hero">
    <p class="brand-mark">Galexer</p>

    <div class="search-box">
      <svg class="icon" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
      <input type="text" class="prompt-input" placeholder="Search or enter URL..." aria-label="Search">
    </div>

    <div class="launcher" aria-label="Quick launch">
      <div class="launcher-grid">
        <button class="launch-tile" data-open="https://www.youtube.com" data-title="YouTube">
          <span class="tile-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="6" width="20" height="12" rx="4"></rect><polygon points="10 9 15 12 10 15 10 9"></polygon></svg></span>
          <span class="tile-label">youtube</span>
        </button>
        <button class="launch-tile" data-open="https://github.com" data-title="GitHub">
          <span class="tile-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M9 19c-4.3 1.4-4.3-2.5-6-3m12 5v-3.5c0-1 .1-1.4-.5-2 2.8-.3 5.5-1.4 5.5-6a4.6 4.6 0 0 0-1.3-3.2 4.2 4.2 0 0 0-.1-3.2s-1.1-.3-3.5 1.3a12.3 12.3 0 0 0-6.2 0C6.5 1.9 5.4 2.2 5.4 2.2a4.2 4.2 0 0 0-.1 3.2A4.6 4.6 0 0 0 4 8.6c0 4.6 2.7 5.7 5.5 6-.6.6-.6 1.2-.5 2V21"></path></svg></span>
          <span class="tile-label">github</span>
        </button>
        <button class="launch-tile" data-open="https://discord.com" data-title="Discord">
          <span class="tile-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="14" rx="4"></rect><circle cx="9" cy="12" r="1"></circle><circle cx="15" cy="12" r="1"></circle></svg></span>
          <span class="tile-label">discord</span>
        </button>
        <button class="launch-tile" data-open="https://x.com" data-title="X">
          <span class="tile-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><line x1="4" y1="4" x2="20" y2="20"></line><line x1="20" y1="4" x2="4" y2="20"></line></svg></span>
          <span class="tile-label">twitter</span>
        </button>
        <button class="launch-tile" data-open="https://reddit.com" data-title="Reddit">
          <span class="tile-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="13" r="7"></circle><circle cx="9" cy="14" r="1"></circle><circle cx="15" cy="14" r="1"></circle><path d="M9 17c1 .7 4 .7 5 0"></path><path d="M12 6V3m0 0h2.5M18 9a1.5 1.5 0 1 0 0-3 1.5 1.5 0 0 0 0 3z"></path></svg></span>
          <span class="tile-label">reddit</span>
        </button>
        <button class="launch-tile" data-open="https://www.instagram.com" data-title="Instagram">
          <span class="tile-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="5"></rect><circle cx="12" cy="12" r="4"></circle><line x1="17.5" y1="6.5" x2="17.5" y2="6.5"></line></svg></span>
          <span class="tile-label">instagram</span>
        </button>
      </div>
    </div>

    <div class="signature">
      <div class="sig-line-wrap"><span class="sig-line"></span></div>
      <p class="sig-text">Made by Noah</p>
    </div>
  </section>
</template>

<script>
  const SEARCH_ENGINE_URL = 'https://duckduckgo.com/?q=';

  // ---------------------------------------------------------------
  // Rising particle field
  // ---------------------------------------------------------------
  (function(){
    const field = document.getElementById('bgParticles');
    const count = 22;
    for(let i = 0; i < count; i++){
      const p = document.createElement('div');
      p.className = 'particle';
      const size = 3 + Math.random() * 6;
      const left = Math.random() * 100;
      const duration = 14 + Math.random() * 16;
      const delay = -Math.random() * duration;
      const drift = (Math.random() * 80 - 40).toFixed(0) + 'px';
      p.style.width = size + 'px';
      p.style.height = size + 'px';
      p.style.left = left + '%';
      p.style.setProperty('--drift', drift);
      p.style.animationDuration = duration + 's';
      p.style.animationDelay = delay + 's';
      field.appendChild(p);
    }
  })();

  // ---------------------------------------------------------------
  // Browser engine: tabs, address bar, view area
  // ---------------------------------------------------------------
  const tabstrip = document.getElementById('tabstrip');
  const viewArea = document.getElementById('viewArea');
  const addressInput = document.getElementById('addressInput');
  const backBtn = document.getElementById('backBtn');
  const fwdBtn = document.getElementById('fwdBtn');
  const reloadBtn = document.getElementById('reloadBtn');
  const homeBtn = document.getElementById('homeBtn');
  const fullscreenBtn = document.getElementById('fullscreenBtn');
  const homeTemplate = document.getElementById('homeTemplate');

  let seq = 1;
  let tabs = [];
  let activeId = null;

  function looksLikeUrl(input){
    if(/^https?:\/\//i.test(input)) return true;
    return /^[a-z0-9-]+(\.[a-z0-9-]+)+(:\d+)?(\/[^\s]*)?$/i.test(input) && !input.includes(' ');
  }

  function resolveDestination(rawInput){
    const q = rawInput.trim();
    if(!q) return null;
    if(looksLikeUrl(q)){
      const url = /^https?:\/\//i.test(q) ? q : 'https://' + q;
      let label;
      try{ label = new URL(url).hostname.replace(/^www\./,''); }catch(e){ label = q; }
      return {url, title:label};
    }
    return {url: SEARCH_ENGINE_URL + encodeURIComponent(q), title: q};
  }

  function newTab(dest){
    const tab = { id: seq++, title: dest ? dest.title : 'New Tab', url: dest ? dest.url : null };
    tabs.push(tab);
    activeId = tab.id;
    renderTabstrip();
    renderView();
    return tab;
  }

  function closeTab(id){
    const idx = tabs.findIndex(t => t.id === id);
    if(idx === -1) return;
    tabs.splice(idx, 1);
    if(tabs.length === 0){ newTab(); return; }
    if(activeId === id){
      const neighbor = tabs[idx] || tabs[idx - 1];
      activeId = neighbor.id;
    }
    renderTabstrip();
    renderView();
  }

  function switchTab(id){
    activeId = id;
    renderTabstrip();
    renderView();
  }

  function activeTab(){ return tabs.find(t => t.id === activeId); }

  function navigateActiveTab(dest){
    const tab = activeTab();
    if(!tab || !dest) return;
    tab.url = dest.url;
    tab.title = dest.title;
    renderTabstrip();
    renderView();
  }

  function goHome(){
    const tab = activeTab();
    if(!tab) return;
    tab.url = null;
    tab.title = 'New Tab';
    renderTabstrip();
    renderView();
  }

  function renderTabstrip(){
    tabstrip.innerHTML = tabs.map(t => `
      <button class="tab ${t.id === activeId ? 'active' : ''}" data-tab-id="${t.id}">
        <span class="tab-title">${t.title}</span>
        <span class="tab-close" data-close-id="${t.id}">
          <svg class="icon" viewBox="0 0 24 24" style="width:11px;height:11px;"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
        </span>
      </button>
    `).join('') + `
      <button class="new-tab-btn" id="newTabBtn" aria-label="New tab">
        <svg class="icon" viewBox="0 0 24 24" style="width:14px;height:14px;"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>
      </button>
    `;
    tabstrip.querySelectorAll('.tab').forEach(el => {
      el.addEventListener('click', (e) => {
        if(e.target.closest('[data-close-id]')) return;
        switchTab(Number(el.dataset.tabId));
      });
    });
    tabstrip.querySelectorAll('[data-close-id]').forEach(el => {
      el.addEventListener('click', (e) => {
        e.stopPropagation();
        closeTab(Number(el.dataset.closeId));
      });
    });
    document.getElementById('newTabBtn').addEventListener('click', () => newTab());
  }

  function renderView(){
    const tab = activeTab();
    viewArea.innerHTML = '';
    if(!tab) return;

    addressInput.value = tab.url || '';
    backBtn.disabled = !tab.url;
    fwdBtn.disabled = !tab.url;

    if(!tab.url){
      const view = document.createElement('div');
      view.className = 'view';
      view.appendChild(homeTemplate.content.cloneNode(true));
      viewArea.appendChild(view);
      wireHomeView(view);
      reloadBtn.onclick = () => { renderView(); };
      backBtn.onclick = null;
      fwdBtn.onclick = null;
      return;
    }

    const view = document.createElement('div');
    view.className = 'view';
    view.style.overflow = 'hidden';

    const iframe = document.createElement('iframe');
    iframe.src = tab.url;
    iframe.setAttribute('referrerpolicy', 'no-referrer');
    view.appendChild(iframe);

    const note = document.createElement('div');
    note.className = 'frame-note';
    note.innerHTML = `
      <span>Some sites block being shown inside another page for security. If this tab looks blank, open it directly instead.</span>
      <button type="button" data-open-external>
        <svg class="icon" viewBox="0 0 24 24" style="width:12px;height:12px;"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"></path><polyline points="15 3 21 3 21 9"></polyline><line x1="10" y1="14" x2="21" y2="3"></line></svg>
        Open directly
      </button>
    `;
    note.querySelector('[data-open-external]').addEventListener('click', () => {
      window.open(tab.url, '_blank', 'noopener');
    });
    view.appendChild(note);

    viewArea.appendChild(view);

    reloadBtn.onclick = () => { iframe.src = tab.url; };
    backBtn.onclick = () => { try{ iframe.contentWindow.history.back(); }catch(e){} };
    fwdBtn.onclick = () => { try{ iframe.contentWindow.history.forward(); }catch(e){} };
  }

  function wireHomeView(root){
    const promptInput = root.querySelector('.prompt-input');

    function submitPrompt(){
      const dest = resolveDestination(promptInput.value);
      if(!dest) return;
      navigateActiveTab(dest);
    }
    promptInput.addEventListener('keydown', (e) => {
      if(e.key === 'Enter'){ e.preventDefault(); submitPrompt(); }
    });

    root.querySelectorAll('.launch-tile').forEach(tile => {
      tile.addEventListener('click', () => {
        newTab({url: tile.dataset.open, title: tile.dataset.title});
      });
    });

    // Rotating-font signature credit, re-wired each time the home view renders
    const sigLine = root.querySelector('.sig-line');
    const sigText = root.querySelector('.sig-text');
    if(sigLine && sigText){
      const SIGNATURE_FONTS = [
        "'Inter', sans-serif", "'Lora', serif", "'Fira Code', monospace",
        "'Playfair Display', serif", "'Bebas Neue', sans-serif", "'Pacifico', cursive",
        "'Space Mono', monospace", "'Caveat', cursive", "'Righteous', sans-serif",
        "'Cormorant Garamond', serif"
      ];
      let fontIndex = Math.floor(Math.random() * SIGNATURE_FONTS.length);
      function applyNextFont(){
        sigText.style.fontFamily = SIGNATURE_FONTS[fontIndex];
        fontIndex = (fontIndex + 1) % SIGNATURE_FONTS.length;
      }
      applyNextFont();
      sigLine.addEventListener('animationiteration', applyNextFont);
    }
  }

  // Address bar controls
  function submitAddressBar(){
    const dest = resolveDestination(addressInput.value);
    if(dest) navigateActiveTab(dest);
  }
  addressInput.addEventListener('keydown', (e) => {
    if(e.key === 'Enter'){ submitAddressBar(); }
  });

  homeBtn.addEventListener('click', goHome);
  document.getElementById('fabHome').addEventListener('click', () => newTab());
  fullscreenBtn.addEventListener('click', () => {
    if(!document.fullscreenElement){ document.documentElement.requestFullscreen().catch(()=>{}); }
    else{ document.exitFullscreen().catch(()=>{}); }
  });

  // Boot with a single New Tab
  newTab();
</script>

</body>
</html>
